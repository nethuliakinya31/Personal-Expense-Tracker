<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <nav class="navbar"><div class="container"><span>Personal Expense Tracker</span></div>
    </nav>

    <main class="container">
        <h1>Financial Dashboard</h1>
        <p class="subtitle">Manage your income and expenses in one place.</p>

        <section class="summary">
            <div class="card"><small>Total Income</small><strong id="totalIncome">LKR 0.00</strong>
            </div>

            <div class="card"><small>Total Expenses</small><strong id="totalExpenses">LKR 0.00</strong>
            </div>

            <div class="card"><small>Current Balance</small><strong id="balance">LKR 0.00</strong>
            </div>
        </section>

        <section class="card">
            <h2>Add a Transaction</h2>
            <form id="transactionForm" novalidate>
                <div class="grid">
                    <label>Transaction Type
                        <select id="type">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </label>
                    <label>Description
                        <input type="text" id="description" placeholder="e.g. Monthly allowance">
                    </label>
                    <label>Amount (LKR)
                        <input type="number" id="amount" placeholder="Enter amount" min="0" step="0.01">
                    </label>
                    <label>Category
                        <select id="category">
                            <option value="">Select a category</option>
                            <option>Allowance</option>                            
                            <option>Food</option>
                            <option>Salary</option>
                            <option>Transport</option>
                            <option>Education</option>
                            <option>Entertainment</option>
                            <option>Shopping</option>
                            <option>Bills</option>
                            <option>Other</option>
                        </select>
                    </label>
                    <label>Transaction Date
                        <input type="date" id="date">
                    </label>
                    </div>
                    <p id="error"class="error" role="alert"></p>
                    <div class="actions">
                        <button type="submit"class="btn primary">Add Transaction</button>
                        <button type="button"id="clearBtn"class="btn">Clear Form</button>
                    </div>
                </form>
        </section>

        <section class="card">
            <h2>Transaction History</h2>
            <div class="grid">
                <label>Filter by Type
                    <select id="filter">
                        <option value="all">All Transactions</option>
                        <option value="income">Income Only</option>
                        <option value="expense">Expenses Only</option>
                    </select>
                </label>
                <label>Search Transactions
                    <input type="search"id="search"placeholder="Search by description or category">
                </label>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Date</th><th>Description</th><th>Type</th><th>Category</th><th class="right">Amount(LKR)</th><th>Action</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
      
    <footer>Personal Expense Tracker| Front-End Development Lab</footer>
    <script src="script.js"></script>
  </body>
</html>
